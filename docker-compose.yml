services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: apexoperator
      POSTGRES_USER: apexoperator
      POSTGRES_PASSWORD: apexoperator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexoperator -d apexoperator"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production-like
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://apexoperator:apexoperator@postgres:5432/apexoperator
      APEX_PLANNER: mock
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
